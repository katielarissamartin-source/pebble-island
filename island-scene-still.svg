<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" preserveAspectRatio="none" role="img" aria-label="A colourful tropical island with mountains, rainforest, a glowing cave, coral reef, treasure beach, and a welcoming cove">
